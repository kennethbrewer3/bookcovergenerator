services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: book_cover_designer
      POSTGRES_PASSWORD: "ZRnHSYxQVBAYjCIf8gBi_FLOMw0VUxyf"
    volumes:
      - book_cover_designer_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "0oZO-B0tv6Cyn8gXMm3tH2ZQV95RF8Q9"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: book_cover_designer_test
      POSTGRES_PASSWORD: "QG0r6sr5d3gyu550kYc7EXS6bT7c7sPf"
    volumes:
      - book_cover_designer_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "EwHSdLrtZCnH9eI-K8gHeHhCINQPXcvJ"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  book_cover_designer_data:
  book_cover_designer_test_data:
