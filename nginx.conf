server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;

  types {
    application/javascript js mjs;
    application/wasm wasm;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /favicon.ico {
    try_files /favicon.ico =204;
  }
}