services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "53589:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    command:
      - --mode=production
      - --server-id=default
      - --logging=normal
      - --role=monolith
    environment:
      SERVERPOD_PASSWORD_database: "ZRnHSYxQVBAYjCIf8gBi_FLOMw0VUxyf"
      SERVERPOD_PASSWORD_redis: "0oZO-B0tv6Cyn8gXMm3tH2ZQV95RF8Q9"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: book_cover_designer
      POSTGRES_PASSWORD: "ZRnHSYxQVBAYjCIf8gBi_FLOMw0VUxyf"
    volumes:
      - book_cover_designer_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:6.2.6
    command: redis-server --requirepass "0oZO-B0tv6Cyn8gXMm3tH2ZQV95RF8Q9"
    restart: unless-stopped

volumes:
  book_cover_designer_data: